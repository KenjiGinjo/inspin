name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: inspin-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inspin-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/inspin-test
      DATABASE_LOG: 'false'
      APP_STAGE: dev
      PORT: '10001'
      JWT_SECRET: ci-jwt-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install

      - name: Migrate test database
        working-directory: apps/db
        run: bun src/db-script.ts migrate

      - run: pnpm lint
      - run: pnpm exec turbo check-types --filter=api --filter=db --filter=web-app
