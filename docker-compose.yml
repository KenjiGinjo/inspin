services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inspin
      POSTGRES_PASSWORD: inspin
      POSTGRES_DB: inspin
    ports:
      - '5432:5432'
    volumes:
      - inspin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inspin -d inspin']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inspin_pg:
